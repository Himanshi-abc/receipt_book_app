name: receipt_book
description: "ReceiptBook - Income/Expense Receipt Scanner + Business Dashboard + GST Invoice Generator + ITR Helper"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Firebase (backend: auth + data + storage)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2

  # OCR (on-device, offline-capable)
  google_mlkit_text_recognition: ^0.13.0

  # Camera / gallery
  image_picker: ^1.1.2
  file_picker: ^8.1.2  # attach a receipt file of any format (PDF, image, etc.)

  # Local offline-first cache (transactions saved locally first, then synced)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4+4  # required for Windows/Linux desktop
  path_provider: ^2.1.4
  path: ^1.9.0

  # Connectivity (to know when to sync)
  connectivity_plus: ^6.0.5

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  share_plus: ^10.0.2
  local_auth: ^2.3.0   # biometric app lock
  fl_chart: ^0.69.0    # dashboard trend + category charts
  pdf: ^3.11.1         # invoice PDF generation
  printing: ^5.13.4    # PDF preview widget + OS print/share integration

  # Khata ledger (Customers/Suppliers): pick a party from device contacts,
  # call a party from their ledger screen
  flutter_contacts: ^1.1.9+2
  url_launcher: ^6.3.0
  font_awesome_flutter: ^11.0.0  # WhatsApp brand icon (not in Material Icons)

  # Products catalog: "Download stock excel" export
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true