# Avast's "Web/Mail Shield" HTTPS scanning intercepts and re-signs all TLS
# traffic on this machine with its own root CA, which the JDK's bundled
# cacerts truststore doesn't trust (unlike Windows itself), causing random
# "PKIX path building failed" dependency-download failures. This points the
# Gradle daemon at a copy of cacerts with Avast's root CA added instead of
# requiring admin rights to modify the JDK install directly.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStore=C:/Users/AKB/.gradle/avast-cacerts -Djavax.net.ssl.trustStorePassword=changeit
android.useAndroidX=true
# Network to plugins.gradle.org / dl.google.com has been flaky on this
# machine (DNS + TLS revocation-check timeouts observed directly) - these
# make Gradle retry transient resolution failures instead of failing the
# whole build on one dropped request.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Clear system proxy blocks completely
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=